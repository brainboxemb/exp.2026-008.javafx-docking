name: Verify experiment

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Bootstrap SnapFX release dependency
        shell: pwsh
        run: ./bootstrap.ps1

      - name: Verify SnapFX Maven artifact
        shell: pwsh
        run: |
          $base = Join-Path $HOME ".m2/repository/org/snapfx/snapfx-core/0.8.0-0"
          if (-not (Test-Path (Join-Path $base "snapfx-core-0.8.0-0.jar"))) {
            throw "SnapFX JAR missing from Maven local"
          }
          if (-not (Test-Path (Join-Path $base "snapfx-core-0.8.0-0.pom"))) {
            throw "SnapFX POM missing from Maven local"
          }

      - name: Verify experiment
        shell: bash
        run: mvn -B -ntp verify
